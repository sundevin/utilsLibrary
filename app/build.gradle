apply plugin: 'com.android.application'

android {
    namespace 'com.devin.utilscenter'
    compileSdk 34
    defaultConfig {
        applicationId "com.devin.utilscenter"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"
    }
}



dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation project(':utilslibrary')

    implementation 'com.belerweb:pinyin4j:2.5.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation'com.alibaba:fastjson:1.2.83'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation "androidx.camera:camera-core:1.3.0-alpha05"
    implementation "androidx.camera:camera-camera2:1.3.0-alpha05"
    implementation "androidx.camera:camera-lifecycle:1.3.0-alpha05"
    implementation "androidx.camera:camera-view:1.3.0-alpha05"
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity:1.8.0'

//    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
//    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
//    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
//    implementation 'androidx.startup:startup-runtime:1.2.0'


}
